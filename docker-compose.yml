version: "3.9"
services:
  sniperscan:
    build: .
    command: ["/usr/local/bin/sniperscan", "serve", "--addr", ":8097"]
    ports:
      - "8097:8097"

  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "9097:9090"
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - sniperscan
